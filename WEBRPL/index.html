<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Layout Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Kontainer untuk header dan sidebar -->
    <div class="header-aside-container">
        <!-- Sidebar -->
        <aside>
            <img src="image/plbg.png" alt="Popular Articles" class="sidebar-image">
            <h3>Artikel Populer</h3>
            <ul>
                <li><a href="#">Artikel 1</a></li>
                <li><a href="#">Artikel 2</a></li>
                <li><a href="#">Artikel 3</a></li>
                <li><a href="#">Artikel 4</a></li>
            </ul>
        </aside>

        <!-- Header -->
        <header>
            <img src="image/header.png" alt="Header" class="header-image">
        </header>
    </div>

    <!-- Navbar -->
    <nav>
        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">PROFIL</a></li>
            <li><a href="#">GALERI</a></li>
            <li><a href="#">KONTAK</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Content -->
        <section class="content">
            <h2>Selamat Datang</h2>
            <p>Selamat datang di website kami. Situs ini dibuat untuk memudahkan Anda belajar HTML dan CSS.</p>
            
            <h3>Galeri</h3>
            <div class="gallery">
                <img src="image/a.jpg" alt="Gallery Image 1">
                <img src="image/b.jpg" alt="Gallery Image 2">
                <img src="image/c.jpg" alt="Gallery Image 3">
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 AIP Indonesia. All rights reserved.</p>
    </footer>
</body>
</html>
