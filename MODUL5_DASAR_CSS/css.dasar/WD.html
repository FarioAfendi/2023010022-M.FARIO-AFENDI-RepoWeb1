<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman dengan Warna Border pada Teks</title>
    <style>
        /* Mengatur gaya dan warna border pada elemen teks */
        body {
            background-color: #f9f9f9; /* Latar belakang abu-abu muda */
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #333; /* Warna teks abu-abu tua */
            font-size: 2.5em;
            border: 3px solid #FF5733; /* Border oranye */
            padding: 10px;
            display: inline-block;
        }

        p {
            color: #333; /* Warna teks abu-abu tua */
            font-size: 1.2em;
            border: 2px dashed #3498DB; /* Border biru dengan gaya dashed */
            padding: 10px;
            margin-top: 20px;
            display: inline-block;
        }

        /* Border khusus dengan warna dan gaya berbeda */
        .highlight {
            border: 2px dotted #28B463; /* Border hijau dengan gaya dotted */
            padding: 10px;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Judul dengan Border Oranye</h1>
    <p>Ini adalah contoh paragraf dengan border biru dashed di sekitar teks.</p>
    <p class="highlight">Teks ini memiliki border hijau dotted sebagai penekanan.</p>
</body>
</html>
