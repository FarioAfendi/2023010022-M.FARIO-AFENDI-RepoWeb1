<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman dengan Warna Teks</title>
    <style>
        /* Mengatur warna teks pada seluruh halaman */
        body {
            background-color: #f0f0f0; /* Latar belakang abu-abu muda */
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #FF5733; /* Warna teks oranye untuk judul */
            font-size: 2.5em;
        }

        p {
            color: #3498DB; /* Warna teks biru untuk paragraf */
            font-size: 1.2em;
        }

        /* Anda juga dapat menambahkan gaya untuk elemen lain dengan warna berbeda */
        .highlight {
            color: #28B463; /* Warna teks hijau untuk elemen tertentu */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Selamat Datang di Halaman dengan Warna Teks</h1>
    <p>Ini adalah contoh paragraf dengan warna teks biru.</p>
    <p class="highlight">Teks ini memiliki warna hijau sebagai penekanan.</p>
</body>
</html>
