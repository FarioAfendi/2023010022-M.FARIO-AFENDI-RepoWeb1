<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Tidak Diulang</title>
    <style>
        body {
            background-image: url('background-image.jpg'); /* Ganti dengan URL gambar */
            background-repeat: no-repeat; /* Tidak mengulangi background */
            background-size: cover; /* Menyesuaikan gambar background untuk menutupi seluruh halaman */
            font-family: Arial, sans-serif;
            color: #333;
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
    <h1>Halaman dengan Background yang Tidak Diulang</h1>
    <p>Background ini tidak diulang, dan hanya muncul sekali.</p>
</body>
</html>
