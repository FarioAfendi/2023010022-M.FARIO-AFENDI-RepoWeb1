<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Diulang ke Bawah</title>
    <style>
        body {
            background-image: url('saya.jpeg'); /* Ganti dengan URL gambar */
            background-repeat: repeat-y; /* Mengulangi background hanya secara vertikal */
            font-family: Arial, sans-serif;
            color: #333;
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
    <h1>Halaman dengan Background yang Diulang ke Bawah</h1>
    <p>Background ini hanya diulang ke bawah (vertikal).</p>
</body>
</html>
