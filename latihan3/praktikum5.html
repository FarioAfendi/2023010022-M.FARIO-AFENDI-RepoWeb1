<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Mahasiswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            font-weight: bold;
            text-align: center;
        }
        form {
            max-width: 500px;
            margin: 20px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        label {
            display: inline-block;
            width: 120px;
            margin-top: 10px;
            vertical-align: top;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        input[type="file"] {
            margin-top: 5px;
        }
        input[type="radio"] {
            margin-top: 10px;
        }
        .button {
            text-align: center;
            margin-top: 15px;
        }
        .button input {
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button input:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
<form action="#" method="post">
    <h1>Formulir Pendaftaran Mahasiswa</h1
    <label for="name">Nama Lengkap:</label>
    <input type="text" id="name" name="name" required><br>

    <label>Jenis Kelamin:</label>
    <input type="radio" id="male" name="gender" value="pria" required>
    <label for="male" style="display: inline;">Pria</label>
    <input type="radio" id="female" name="gender" value="wanita" required>
    <label for="female" style="display: inline;">Wanita</label><br>

    <label for="dob">Tanggal Lahir:</label>
    <input type="date" id="dob" name="dob" required><br>

    <label for="address">Alamat:</label>
    <input type="text" id="address" name="address"><br>

    <label for="program">Program Studi:</label>
    <select id="program" name="program">
        <option value="rpl">Rekayasa Perangkat Lunak</option>
        <option value="ti">Teknik Informatika</option>
        <option value="si">Sistem Informasi</option>
        <option value="dkv">Desain Komunikasi Visual</option>
    </select><br>

    <label for="phone">Nomor Hp:</label>
    <input type="tel" id="phone" name="phone" placeholder="081234567890" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br>




    <div class="button">
        <input type="submit" value="Daftar">
    </div>
</form>

</body>
</html>
