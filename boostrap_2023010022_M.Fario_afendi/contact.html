<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Pemesanan Mie Ayam</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #228b22;
        }
        .navbar-brand {
            color: #ffcc00;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #ffcc00;
            border-color: #ffcc00;
            color: #333;
        }
        .btn-primary:hover {
            background-color: #e6b800;
        }
        .form-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mie Ayam Lezat</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-light" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="contact.html">Pemesanan</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="form-container mx-auto">
            <h2 class="text-center mb-4">Form Pemesanan</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Nama Lengkap</label>
                    <input type="text" class="form-control" id="name" placeholder="Masukkan nama Anda" required />
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Nomor Telepon</label>
                    <input type="tel" class="form-control" id="phone" placeholder="Masukkan nomor telepon" required />
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Alamat</label>
                    <textarea class="form-control" id="address" rows="3" placeholder="Masukkan alamat lengkap" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="order" class="form-label">Pesanan</label>
                    <textarea class="form-control" id="order" rows="3" placeholder="Masukkan detail pesanan" required></textarea>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Kirim Pemesanan</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center py-3" style="background-color: #228b22; color: #fff;">
        <p>&copy; 2024 Mie Ayam Lezat. Semua Hak Dilindungi.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
